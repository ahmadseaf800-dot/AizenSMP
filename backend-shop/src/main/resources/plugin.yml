name: AizenShop
version: 1.1.0
main: com.aizensmp.shop.AizenShop
api-version: '1.21'
authors: [Aizen]
description: AizenSMP economy, Donut-style shop, shard spawners, sell system and 54-slot ender chest.
commands:
  shop:
    description: Open the AizenSMP shop
    usage: /shop
  balance:
    aliases: [bal, money]
    description: Show your money balance
    usage: /balance
  shards:
    description: Show your shard balance
    usage: /shards
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
  sell:
    description: Sell items for fixed prices
    usage: /sell
  enderchest:
    aliases: [ec, echest]
    description: Open your 54-slot Aizen Ender Chest
    usage: /enderchest
