name: AizenSMP Network

on:
  workflow_dispatch:
    inputs:
      manual_start:
        description: "Start the AizenSMP network manually"
        required: false
        default: "true"
        type: boolean
  repository_dispatch:
    types: [aizensmp_start]

permissions:
  contents: read
  actions: write

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout AizenSMP
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Save Java 21
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Save Java 25
        run: echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Restore persistent data
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYIT_CONFIG_BASE64: ${{ secrets.PLAYIT_CONFIG_BASE64 }}
        shell: bash
        run: |
          set -e
          PLAYIT_ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aizensmp-playit-config&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$PLAYIT_ARTIFACT_ID" ]; then
            mkdir -p restore/playit
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PLAYIT_ARTIFACT_ID/zip" > restore/playit.zip
            unzip -q restore/playit.zip -d restore/playit
            mkdir -p "$HOME/.config/playit_gg"
            if [ -f restore/playit/playit.toml ]; then
              cp restore/playit/playit.toml "$HOME/.config/playit_gg/playit.toml"
              chmod 600 "$HOME/.config/playit_gg/playit.toml"
              echo "Playit config restored from Playit artifact."
            fi
          fi

          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aizensmp-persistent-data&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            mkdir -p restore
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > restore/persistent.zip
            unzip -q restore/persistent.zip -d restore/artifact
            if [ -f restore/artifact/persistent-data.tar.zst ]; then
              mkdir -p network
              tar --zstd -xf restore/artifact/persistent-data.tar.zst -C network || true
            fi
          fi

          if [ ! -f "$HOME/.config/playit_gg/playit.toml" ] && [ -n "${PLAYIT_CONFIG_BASE64:-}" ]; then
            mkdir -p "$HOME/.config/playit_gg"
            printf '%s' "$PLAYIT_CONFIG_BASE64" | base64 --decode > "$HOME/.config/playit_gg/playit.toml"
            chmod 600 "$HOME/.config/playit_gg/playit.toml"
            echo "Playit config restored from repository secret."
          fi

      - name: Download Purpur and Velocity
        shell: bash
        run: |
          set -e
          for name in germany turkey america; do
            mkdir -p "network/$name/plugins"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/server.jar" "https://api.purpurmc.org/v2/purpur/1.21.11/latest/download"
            test -s "network/$name/server.jar"
            jar tf "network/$name/server.jar" >/dev/null
            echo "eula=true" > "network/$name/eula.txt"
          done

          mkdir -p network/velocity
          PAPERMC_UA="AizenSMP/1.0 (GitHub Actions)"

          VELOCITY_VERSION=$(curl -fsSL -H "User-Agent: $PAPERMC_UA" https://fill.papermc.io/v3/projects/velocity | jq -r '.versions | to_entries[0].value[0]')
          test -n "$VELOCITY_VERSION" && test "$VELOCITY_VERSION" != "null"

          VELOCITY_BUILD=$(curl -fsSL -H "User-Agent: $PAPERMC_UA" "https://fill.papermc.io/v3/projects/velocity/versions/$VELOCITY_VERSION" | jq -r '.builds[0]')
          test -n "$VELOCITY_BUILD" && test "$VELOCITY_BUILD" != "null"

          VELOCITY_META=$(curl -fsSL -H "User-Agent: $PAPERMC_UA" "https://fill.papermc.io/v3/projects/velocity/versions/$VELOCITY_VERSION/builds/$VELOCITY_BUILD")
          VELOCITY_URL=$(echo "$VELOCITY_META" | jq -r '.downloads."server:default".url // empty')
          test -n "$VELOCITY_URL"

          echo "Downloading Velocity $VELOCITY_VERSION build $VELOCITY_BUILD"
          curl -fsSL --retry 5 --retry-delay 2 -o network/velocity/velocity.jar "$VELOCITY_URL"
          test -s network/velocity/velocity.jar
          jar tf network/velocity/velocity.jar >/dev/null
          echo "Velocity JAR verified successfully."

          rm -rf proxy/build
          mkdir -p proxy/build/classes network/velocity/plugins
          "$JAVA25_HOME/bin/javac" -cp network/velocity/velocity.jar -d proxy/build/classes proxy/src/main/java/com/aizensmp/proxy/AizenProxy.java
          jar --create --file network/velocity/plugins/AizenProxy.jar -C proxy/build/classes . -C proxy/src/main/resources velocity-plugin.json
          test -s network/velocity/plugins/AizenProxy.jar
          echo "AizenProxy built successfully."

      - name: Install backend plugins
        shell: bash
        run: |
          set -euo pipefail

          MODRINTH_API="https://api.modrinth.com/v2"
          MODRINTH_UA="AizenSMP/1.0 (GitHub Actions)"

          modrinth_file() {
            local project="$1"
            local loader="$2"
            local url
            url=$(curl -fsSL --retry 5 --retry-delay 2               -H "User-Agent: $MODRINTH_UA"               --get "$MODRINTH_API/project/$project/version"               --data-urlencode "loaders=[\"$loader\"]"               | jq -r '[.[].files[] | select(.primary == true) | .url][0] // empty')
            test -n "$url"
            test "$url" != "null"
            printf '%s' "$url"
          }

          SVC_URL=$(modrinth_file "simple-voice-chat" "paper")
          WE_URL=$(modrinth_file "worldedit" "paper")

          VIAVERSION_URL=$(curl -fsSL --retry 5 --retry-delay 2             -H "User-Agent: $MODRINTH_UA"             --get "$MODRINTH_API/project/viaversion/version"             --data-urlencode 'loaders=["paper"]'             | jq -r '[.[].files[] | select(.primary == true) | .url][0] // empty')

          VIABACKWARDS_URL=$(curl -fsSL --retry 5 --retry-delay 2             -H "User-Agent: $MODRINTH_UA"             --get "$MODRINTH_API/project/viabackwards/version"             --data-urlencode 'loaders=["paper"]'             | jq -r '[.[].files[] | select(.primary == true) | .url][0] // empty')

          for var in SVC_URL WE_URL VIAVERSION_URL VIABACKWARDS_URL; do
            value="${!var}"
            test -n "$value" && test "$value" != "null"
          done

          echo "Simple Voice Chat: $SVC_URL"
          echo "WorldEdit: $WE_URL"
          echo "ViaVersion: $VIAVERSION_URL"
          echo "ViaBackwards: $VIABACKWARDS_URL"

          SKRIPT_URL=$(modrinth_file "skript" "paper")

          # AuthMeReloaded: select the normal Bukkit/Paper jar only; exclude Bungee/Velocity variants.
          AUTHME_URL=$(curl -fsSL --retry 5 --retry-delay 2             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/AuthMe/AuthMeReloaded/releases/latest"             | jq -r '[.assets[]
              | select(.name | test("(?i)^AuthMe.*\\.jar$"))
              | select(.name | test("(?i)(Bungee|Velocity)") | not)
              | .browser_download_url][0] // empty')
          test -n "$AUTHME_URL" && test "$AUTHME_URL" != "null"

          echo "Skript: $SKRIPT_URL"
          echo "AuthMe: $AUTHME_URL"

          mkdir -p network/germany/plugins
          curl -L --fail --retry 5 --retry-delay 2 -o "network/germany/plugins/AuthMe.jar" "$AUTHME_URL"
          test -s network/germany/plugins/AuthMe.jar
          jar tf network/germany/plugins/AuthMe.jar >/dev/null

          rm -rf backend/build
          mkdir -p backend/build
          cat > backend/build/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.aizensmp</groupId>
            <artifactId>aizen-auth-guard-build</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.11-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
              <dependency>
                <groupId>fr.xephi.authme</groupId>
                <artifactId>authme</artifactId>
                <version>1.0</version>
                <scope>system</scope>
                <systemPath>${project.basedir}/../network/germany/plugins/AuthMe.jar</systemPath>
              </dependency>
              <dependency>
                <groupId>com.google.code.gson</groupId>
                <artifactId>gson</artifactId>
                <version>2.13.2</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <sourceDirectory>${project.basedir}/../src/main/java</sourceDirectory>
              <resources>
                <resource>
                  <directory>${project.basedir}/../src/main/resources</directory>
                </resource>
              </resources>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.0</version>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          mvn -q -f backend/build/pom.xml package -DskipTests
          test -s backend/build/target/aizen-auth-guard-build-1.0.0.jar
          cp backend/build/target/aizen-auth-guard-build-1.0.0.jar backend/build/AizenAuthGuard.jar
          test -s backend/build/AizenAuthGuard.jar
          echo "AizenAuthGuard built successfully with Paper API, AuthMe API, and Gson."

          for name in germany turkey america; do
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/Skript.jar" "$SKRIPT_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/AuthMe.jar" "$AUTHME_URL"
            cp -f backend/build/AizenAuthGuard.jar "network/$name/plugins/AizenAuthGuard.jar"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/ViaVersion.jar" "$VIAVERSION_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/ViaBackwards.jar" "$VIABACKWARDS_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/WorldEdit.jar" "$WE_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/voicechat.jar" "$SVC_URL"
            mkdir -p "network/$name/plugins/Skript/scripts"
            cp -f plugins/Skript/scripts/*.sk "network/$name/plugins/Skript/scripts/" 2>/dev/null || true

            mkdir -p "network/$name/plugins/AuthMe"
            cat > "network/$name/plugins/AuthMe/config.yml" <<'EOF'
          DataSource:
            backend: SQLITE
          settings:
            sessions:
              enabled: false
            restrictions:
              allowChat: false
              allowCommands: false
              allowedCommands:
                - /login
                - /l
                - /register
                - /reg
                - /captcha
              allowMovement: false
              teleportUnAuthedToSpawn: true
            security:
              passwordHash: SHA256
          registration:
            enabled: true
            force: true
            enablePasswordVerifier: true
          protection:
            enableProtection: true
          EOF
          done
