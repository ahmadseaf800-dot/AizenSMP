name: AizenSMP Server

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}

    steps:
      - name: Checkout AizenSMP
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Purpur 1.21.11
        shell: bash
        run: |
          mkdir -p server/plugins
          curl -L --fail -o server/server.jar "https://api.purpurmc.org/v2/purpur/1.21.11/latest/download"
          echo "eula=true" > server/eula.txt

      - name: Restore persistent world and player data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aizensmp-persistent-data&per_page=1" --jq '.artifacts[0].id // empty')

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Restoring AizenSMP persistent data from artifact $ARTIFACT_ID"
            mkdir -p restore
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > restore/persistent.zip
            unzip -q restore/persistent.zip -d restore/artifact
            if [ -f restore/artifact/persistent-data.tar.zst ]; then
              tar --zstd -xf restore/artifact/persistent-data.tar.zst -C server
            else
              echo "No persistent-data archive found; starting with a fresh world."
            fi
          else
            echo "No previous persistent data found; starting with a fresh world."
          fi

      - name: Install Skript
        shell: bash
        run: |
          curl -L --fail -o server/plugins/Skript.jar "https://github.com/SkriptLang/Skript/releases/latest/download/Skript.jar"

      - name: Install ViaVersion and ViaBackwards
        shell: bash
        run: |
          curl -L --fail -o server/plugins/ViaVersion.jar "https://github.com/ViaVersion/ViaVersion/releases/latest/download/ViaVersion.jar"
          curl -L --fail -o server/plugins/ViaBackwards.jar "https://github.com/ViaVersion/ViaBackwards/releases/latest/download/ViaBackwards.jar"

      - name: Install Geyser and Floodgate
        shell: bash
        run: |
          curl -L --fail -o server/plugins/Geyser-Spigot.jar "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot"
          curl -L --fail -o server/plugins/floodgate-spigot.jar "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"

      - name: Install AuthMe
        shell: bash
        run: |
          AUTHME_URL=$(curl -s https://api.github.com/repos/AuthMe/AuthMeReloaded/releases/latest | grep -o 'https://[^"]*\.jar' | head -n 1)
          test -n "$AUTHME_URL"
          curl -L --fail -o server/plugins/AuthMe.jar "$AUTHME_URL"

      - name: Configure Geyser for Bedrock on the same AizenSMP server
        shell: bash
        run: |
          cat > server/plugins/Geyser-Spigot/config.yml <<'EOF'
          bedrock:
            address: 0.0.0.0
            port: 19132
            clone-remote-port: false
          remote:
            address: 127.0.0.1
            port: 25565
            auth-type: floodgate
          command-suggestions: true
          passthrough-motd: true
          passthrough-player-counts: true
          allow-third-party-capes: true
          show-cooldown: title
          show-coordinates: true
          disable-bedrock-scaffolding: false
          metrics:
            enabled: false
          debug-mode: false
          EOF

      - name: Configure cracked Java and server
        shell: bash
        run: |
          cat > server/server.properties <<'EOF'
          motd=AizenSMP
          online-mode=false
          server-port=25565
          query.port=25565
          enable-query=false
          EOF

      - name: Copy AizenSMP Skript files
        shell: bash
        run: |
          if [ -d "plugins/Skript/scripts" ]; then
            mkdir -p server/plugins/Skript/scripts
            cp -r plugins/Skript/scripts/. server/plugins/Skript/scripts/
          fi

      - name: Start playit.gg tunnel
        if: ${{ env.PLAYIT_SECRET != '' }}
        shell: bash
        run: |
          set -e
          curl -L --fail -o playit-agent "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64"
          chmod +x playit-agent
          nohup ./playit-agent --secret "$PLAYIT_SECRET" > playit.log 2>&1 &
          echo $! > playit.pid

          echo "Waiting for playit.gg tunnel..."
          for i in {1..30}; do
            sleep 2
            if grep -Eqi 'minecraft|tcp|address|tunnel|connect' playit.log; then
              echo "========== AizenSMP PLAYIT.GG =========="
              echo "Java tunnel: TCP -> 25565"
              echo "Bedrock tunnel: UDP -> 19132"
              grep -Ei 'minecraft|tcp|udp|address|tunnel|connect' playit.log | tail -n 30 || true
              echo "========================================"
              break
            fi
          done

          echo "playit.gg log:"
          cat playit.log || true

      - name: Start AizenSMP and save on shutdown
        shell: bash
        working-directory: server
        run: |
          set -e

          cleanup() {
            echo "Preparing persistent AizenSMP data..."
            rm -f persistent-data.tar.zst
            tar --zstd -cf persistent-data.tar.zst               world               world_nether               world_the_end               plugins/Skript               2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          java -Xms1G -Xmx6G -jar server.jar --nogui

      - name: Upload persistent world and player data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aizensmp-persistent-data
          path: server/persistent-data.tar.zst
          retention-days: 90
          compression-level: 0
          overwrite: true
