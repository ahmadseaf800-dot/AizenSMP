name: AizenSMP Network

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout AizenSMP
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore persistent data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aizensmp-persistent-data&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            mkdir -p restore
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > restore/persistent.zip
            unzip -q restore/persistent.zip -d restore/artifact
            if [ -f restore/artifact/persistent-data.tar.zst ]; then
              mkdir -p network
              tar --zstd -xf restore/artifact/persistent-data.tar.zst -C network || true
            fi
          fi

      - name: Download Purpur and Velocity
        shell: bash
        run: |
          set -e
          for name in germany turkey america; do
            mkdir -p "network/$name/plugins"
            curl -L --fail -o "network/$name/server.jar" "https://api.purpurmc.org/v2/purpur/1.21.11/latest/download"
            echo "eula=true" > "network/$name/eula.txt"
          done

          mkdir -p network/velocity
          curl -L --fail -o network/velocity/velocity.jar "https://api.papermc.io/v2/projects/velocity/versions/3.4.0-SNAPSHOT/builds/561/downloads/velocity-3.4.0-SNAPSHOT-561.jar" ||           curl -L --fail -o network/velocity/velocity.jar "https://api.papermc.io/v2/projects/velocity/versions/3.4.0-SNAPSHOT/builds/565/downloads/velocity-3.4.0-SNAPSHOT-565.jar"

      - name: Install backend plugins
        shell: bash
        run: |
          set -e
          SVC_URL=$(curl -fsSL 'https://api.modrinth.com/v2/project/simple-voice-chat/version?loaders=%5B%22paper%22%5D&game_versions=%5B%221.21.11%22%5D' | jq -r '.[0].files[] | select(.primary == true) | .url' | head -n 1)
          test -n "$SVC_URL"

          VIAVERSION_URL=$(curl -fsSL https://api.github.com/repos/ViaVersion/ViaVersion/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          VIABACKWARDS_URL=$(curl -fsSL https://api.github.com/repos/ViaVersion/ViaBackwards/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          WE_URL=$(curl -fsSL 'https://api.modrinth.com/v2/project/worldedit/version?loaders=%5B%22paper%22%5D&game_versions=%5B%221.21.11%22%5D' | jq -r '.[0].files[] | select(.primary == true) | .url' | head -n 1)

          for name in germany turkey america; do
            curl -L --fail -o "network/$name/plugins/Skript.jar" "https://github.com/SkriptLang/Skript/releases/latest/download/Skript.jar"
            curl -L --fail -o "network/$name/plugins/ViaVersion.jar" "$VIAVERSION_URL"
            curl -L --fail -o "network/$name/plugins/ViaBackwards.jar" "$VIABACKWARDS_URL"
            curl -L --fail -o "network/$name/plugins/WorldEdit.jar" "$WE_URL"
            curl -L --fail -o "network/$name/plugins/voicechat.jar" "$SVC_URL"
            mkdir -p "network/$name/plugins/Skript/scripts"
            cp -f plugins/Skript/scripts/*.sk "network/$name/plugins/Skript/scripts/" 2>/dev/null || true
          done

      - name: Configure backend servers and voice chat
        shell: bash
        run: |
          set -e

          configure_server() {
            local name="$1"
            local port="$2"
            mkdir -p "network/$name/plugins"
            cat > "network/$name/server.properties" <<EOF
          motd=AizenSMP - $name
          online-mode=false
          server-port=$port
          server-ip=127.0.0.1
          query.port=$port
          enable-query=false
          EOF
          }

          configure_server germany 25566
          configure_server turkey 25567
          configure_server america 25568

          mkdir -p network/germany/plugins/voicechat
          cat > network/germany/plugins/voicechat/voicechat-server.properties <<'EOF'
          port=25570
          bind_address=0.0.0.0
          voice_host=stamina-trailside.tun.ply.gg:12304
          enable_groups=true
          max_voice_distance=48
          crouch_distance=24
          whisper_distance=24
          spectator_interaction=true
          hide_icons=false
          enable_recording=false
          allow_pings=true
          EOF

          mkdir -p network/turkey/plugins/voicechat
          cat > network/turkey/plugins/voicechat/voicechat-server.properties <<'EOF'
          port=25571
          bind_address=0.0.0.0
          voice_host=stamina-tolerance.tun.ply.gg:12317
          enable_groups=true
          max_voice_distance=48
          crouch_distance=24
          whisper_distance=24
          spectator_interaction=true
          hide_icons=false
          enable_recording=false
          allow_pings=true
          EOF

          mkdir -p network/america/plugins/voicechat
          cat > network/america/plugins/voicechat/voicechat-server.properties <<'EOF'
          port=25572
          bind_address=0.0.0.0
          voice_host=stamina-lightning.tun.ply.gg:12323
          enable_groups=true
          max_voice_distance=48
          crouch_distance=24
          whisper_distance=24
          spectator_interaction=true
          hide_icons=false
          enable_recording=false
          allow_pings=true
          EOF

      - name: Configure Velocity
        shell: bash
        run: |
          set -e
          cd network/velocity
          cat > velocity.toml <<'EOF'
          config-version = "2.7"
          bind = "0.0.0.0:25565"
          motd = "<gold>AizenSMP</gold>"
          show-max-players = 100
          online-mode = false
          player-info-forwarding-mode = "none"
          announce-forge = false
          kick-existing-players = false
          ping-passthrough = "mods"
          sample-players-in-ping = true
          enable-player-address-logging = true

          [servers]
          Germany = "127.0.0.1:25566"
          Turkey = "127.0.0.1:25567"
          America = "127.0.0.1:25568"
          try = ["Germany"]

          [forced-hosts]
          EOF

      - name: Start Playit agent
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.config/playit_gg"
          PLAYIT_SOCKET="$HOME/.config/playit_gg/playit.sock"
          PLAYIT_SECRET="$HOME/.config/playit_gg/playit.toml"

          if [ ! -f "$PLAYIT_SECRET" ]; then
            echo "ERROR: Playit config was not restored."
            exit 1
          fi

          curl -L --fail -o playitd "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64"
          chmod +x playitd
          rm -f "$PLAYIT_SOCKET"
          nohup ./playitd --socket-path "$PLAYIT_SOCKET" --secret-path "$PLAYIT_SECRET" > playitd.log 2>&1 &
          echo $! > playitd.pid

          for i in {1..30}; do
            [ -S "$PLAYIT_SOCKET" ] && break
            sleep 1
          done

          [ -S "$PLAYIT_SOCKET" ] || { cat playitd.log; exit 1; }

      - name: Start AizenSMP network
        shell: bash
        run: |
          set -e

          cleanup() {
            for pid in ${GERMANY_PID:-} ${TURKEY_PID:-} ${AMERICA_PID:-} ${VELOCITY_PID:-}; do
              [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
            done

            rm -f network/persistent-data.tar.zst
            tar --zstd -cf network/persistent-data.tar.zst               network/germany/world network/germany/world_nether network/germany/world_the_end               network/turkey/world network/turkey/world_nether network/turkey/world_the_end               network/america/world network/america/world_nether network/america/world_the_end               network/germany/plugins/Skript network/turkey/plugins/Skript network/america/plugins/Skript               2>/dev/null || true

            if [ -d "$HOME/.config/playit_gg" ]; then
              tar --zstd -rf network/persistent-data.tar.zst -C "$HOME/.config" playit_gg 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          java -Xms512M -Xmx1536M -jar network/velocity/velocity.jar > velocity.log 2>&1 &
          VELOCITY_PID=$!

          java -Xms512M -Xmx1536M -jar network/germany/server.jar --nogui > germany.log 2>&1 &
          GERMANY_PID=$!

          java -Xms512M -Xmx1536M -jar network/turkey/server.jar --nogui > turkey.log 2>&1 &
          TURKEY_PID=$!

          java -Xms512M -Xmx1536M -jar network/america/server.jar --nogui > america.log 2>&1 &
          AMERICA_PID=$!

          echo "AizenSMP network started."
          echo "Velocity: 25565"
          echo "Germany: 25566"
          echo "Turkey: 25567"
          echo "America: 25568"
          echo "Germany Voice: stamina-trailside.tun.ply.gg:12304 -> UDP 25570"
          echo "Turkey Voice: stamina-tolerance.tun.ply.gg:12317 -> UDP 25571"
          echo "America Voice: stamina-lightning.tun.ply.gg:12323 -> UDP 25572"

          wait $VELOCITY_PID
          