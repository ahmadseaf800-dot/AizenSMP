name: AizenSMP Server

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout AizenSMP
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Purpur 1.21.11
        shell: bash
        run: |
          mkdir -p server/plugins
          curl -L --fail -o server/server.jar "https://api.purpurmc.org/v2/purpur/1.21.11/latest/download"
          echo "eula=true" > server/eula.txt

      - name: Restore persistent world and player data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aizensmp-persistent-data&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            mkdir -p restore
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > restore/persistent.zip
            unzip -q restore/persistent.zip -d restore/artifact
            if [ -f restore/artifact/persistent-data.tar.zst ]; then
              tar --zstd -xf restore/artifact/persistent-data.tar.zst -C server
            fi
          fi

      - name: Install gameplay and compatibility plugins
        shell: bash
        run: |
          set -e
          curl -L --fail -o server/plugins/Geyser-Spigot.jar "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot"
          curl -L --fail -o server/plugins/floodgate-spigot.jar "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"
          SKRIPT_URL=$(curl -fsSL https://api.github.com/repos/SkriptLang/Skript/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          curl -L --fail -o server/plugins/Skript.jar "$SKRIPT_URL"
          VIAVERSION_URL=$(curl -fsSL https://api.github.com/repos/ViaVersion/ViaVersion/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          VIABACKWARDS_URL=$(curl -fsSL https://api.github.com/repos/ViaVersion/ViaBackwards/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          curl -L --fail -o server/plugins/ViaVersion.jar "$VIAVERSION_URL"
          curl -L --fail -o server/plugins/ViaBackwards.jar "$VIABACKWARDS_URL"
          SVC_URL=$(curl -fsSL 'https://api.modrinth.com/v2/project/simple-voice-chat/version?loaders=%5B%22paper%22%5D&game_versions=%5B%221.21.11%22%5D' | jq -r '.[0].files[] | select(.primary == true) | .url' | head -n 1)
          test -n "$SVC_URL"
          curl -L --fail -o server/plugins/voicechat.jar "$SVC_URL"

      - name: Copy AizenSMP custom Skript systems
        shell: bash
        run: |
          set -e
          mkdir -p server/plugins/Skript/scripts
          if [ -d "plugins/Skript/scripts" ]; then cp -f plugins/Skript/scripts/*.sk server/plugins/Skript/scripts/; fi
          ls -1 server/plugins/Skript/scripts

      - name: Configure Geyser
        shell: bash
        run: |
          mkdir -p server/plugins/Geyser-Spigot
          cat > server/plugins/Geyser-Spigot/config.yml <<'EOF'
          bedrock:
            address: 0.0.0.0
            port: 19132
            clone-remote-port: false
          remote:
            address: 127.0.0.1
            port: 25565
            auth-type: floodgate
          command-suggestions: true
          passthrough-motd: true
          passthrough-player-counts: true
          allow-third-party-capes: true
          show-cooldown: title
          show-coordinates: true
          disable-bedrock-scaffolding: false
          metrics:
            enabled: false
          debug-mode: false
          EOF

      - name: Configure server
        shell: bash
        run: |
          cat > server/server.properties <<'EOF'
          motd=AizenSMP
          online-mode=false
          server-port=25565
          query.port=25565
          enable-query=false
          EOF

      - name: Claim and start playit.gg agent
        shell: bash
        run: |
          set -e
          curl -L --fail -o playit-agent "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64"
          chmod +x playit-agent

          mkdir -p "$HOME/.config/playit_gg"
          PLAYIT_SOCKET="$HOME/.config/playit_gg/playit.sock"
          rm -f "$PLAYIT_SOCKET"

          echo "========== PLAYIT SETUP =========="
          echo "Starting Playit daemon..."
          echo "Socket: $PLAYIT_SOCKET"
          echo "=================================="

          nohup ./playit-agent --socket-path "$PLAYIT_SOCKET" > playit-daemon.log 2>&1 &
          PLAYIT_DAEMON_PID=$!
          echo "$PLAYIT_DAEMON_PID" > playit.pid
          sleep 2

          if ! kill -0 "$PLAYIT_DAEMON_PID" 2>/dev/null; then
            echo "Playit daemon failed to start."
            cat playit-daemon.log || true
            exit 1
          fi

          echo ""
          echo "========== PLAYIT CLAIM =========="
          echo "The command below generates the official Playit claim URL."
          echo "Open the printed https://playit.gg/claim/... link on your phone."
          echo "Approve the agent in your Playit account."
          echo "=================================="

          ./playit-agent -s --socket-path "$PLAYIT_SOCKET" setup
      - name: Start AizenSMP and save on shutdown
        shell: bash
        working-directory: server
        run: |
          set -e
          cleanup() {
            rm -f persistent-data.tar.zst
            tar --zstd -cf persistent-data.tar.zst world world_nether world_the_end plugins/Skript plugins/AizenCore 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          java -Xms1G -Xmx6G -jar server.jar --nogui

      - name: Upload persistent world and player data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aizensmp-persistent-data
          path: server/persistent-data.tar.zst
          retention-days: 90
          compression-level: 0
          overwrite: true
