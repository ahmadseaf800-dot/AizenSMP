name: AizenSMP Network

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_start:
        description: "Start the AizenSMP network manually"
        required: false
        default: "true"
        type: boolean
  repository_dispatch:
    types: [aizensmp_start]

permissions:
  contents: read
  actions: write

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout AizenSMP
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Save Java 21
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Save Java 25
        run: echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Restore persistent data
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYIT_CONFIG_BASE64: ${{ secrets.PLAYIT_CONFIG_BASE64 }}
        shell: bash
        run: |
          set -e
          PLAYIT_ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aizensmp-playit-config&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$PLAYIT_ARTIFACT_ID" ]; then
            mkdir -p restore/playit
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PLAYIT_ARTIFACT_ID/zip" > restore/playit.zip
            unzip -q restore/playit.zip -d restore/playit
            mkdir -p "$HOME/.config/playit_gg"
            if [ -f restore/playit/playit.toml ]; then
              cp restore/playit/playit.toml "$HOME/.config/playit_gg/playit.toml"
              chmod 600 "$HOME/.config/playit_gg/playit.toml"
              echo "Playit config restored from Playit artifact."
            fi
          fi

          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aizensmp-persistent-data&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            mkdir -p restore
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > restore/persistent.zip
            unzip -q restore/persistent.zip -d restore/artifact
            if [ -f restore/artifact/persistent-data.tar.zst ]; then
              mkdir -p network
              tar --zstd -xf restore/artifact/persistent-data.tar.zst -C network || true
            fi
          fi

          if [ ! -f "$HOME/.config/playit_gg/playit.toml" ] && [ -n "${PLAYIT_CONFIG_BASE64:-}" ]; then
            mkdir -p "$HOME/.config/playit_gg"
            printf '%s' "$PLAYIT_CONFIG_BASE64" | base64 --decode > "$HOME/.config/playit_gg/playit.toml"
            chmod 600 "$HOME/.config/playit_gg/playit.toml"
            echo "Playit config restored from repository secret."
          fi

      - name: Restore server JAR cache
        uses: actions/cache@v4
        with:
          path: |
            network/germany/server.jar
            network/turkey/server.jar
            network/america/server.jar
            network/velocity/velocity.jar
          key: aizensmp-server-jars-v1

      - name: Download Purpur and Velocity
        shell: bash
        run: |
          set -e
          for name in germany turkey america; do
            mkdir -p "network/$name/plugins"
            if [ -s "network/$name/server.jar" ] && jar tf "network/$name/server.jar" >/dev/null 2>&1; then
              echo "Using cached Purpur for $name; skipping 55MB download."
            else
              curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/server.jar" "https://api.purpurmc.org/v2/purpur/1.21.11/latest/download"
              test -s "network/$name/server.jar"
              jar tf "network/$name/server.jar" >/dev/null
            fi
            echo "eula=true" > "network/$name/eula.txt"
            # Purpur/Paper can recreate or reject EULA state during bootstrap;
            # keep it explicitly enabled immediately before every launch.
          done

          mkdir -p network/velocity
          PAPERMC_UA="AizenSMP/1.0 (GitHub Actions)"

          VELOCITY_VERSION=$(curl -fsSL -H "User-Agent: $PAPERMC_UA"             https://fill.papermc.io/v3/projects/velocity             | jq -r '.versions | to_entries[0].value[0]')
          test -n "$VELOCITY_VERSION" && test "$VELOCITY_VERSION" != "null"

          VELOCITY_BUILD=$(curl -fsSL -H "User-Agent: $PAPERMC_UA"             "https://fill.papermc.io/v3/projects/velocity/versions/$VELOCITY_VERSION"             | jq -r '.builds[0]')
          test -n "$VELOCITY_BUILD" && test "$VELOCITY_BUILD" != "null"

          VELOCITY_META=$(curl -fsSL -H "User-Agent: $PAPERMC_UA"             "https://fill.papermc.io/v3/projects/velocity/versions/$VELOCITY_VERSION/builds/$VELOCITY_BUILD")

          VELOCITY_URL=$(echo "$VELOCITY_META" | jq -r '.downloads."server:default".url // empty')
          test -n "$VELOCITY_URL"

          if [ -s network/velocity/velocity.jar ] && jar tf network/velocity/velocity.jar >/dev/null 2>&1; then
            echo "Using cached Velocity JAR; skipping download."
          else
            echo "Downloading Velocity $VELOCITY_VERSION build $VELOCITY_BUILD"
            curl -fsSL --retry 5 --retry-delay 2 -o network/velocity/velocity.jar "$VELOCITY_URL"
          fi

          test -s network/velocity/velocity.jar
          jar tf network/velocity/velocity.jar >/dev/null
          echo "Velocity JAR verified successfully."

          # Build the lightweight Velocity router used by /rtp and automatic
          # Europe/Germany entry. It is compiled against the exact Velocity
          # JAR downloaded above, so the proxy and plugin API stay in sync.
          rm -rf proxy/build
          mkdir -p proxy/build/classes network/velocity/plugins
          "$JAVA25_HOME/bin/javac" -cp network/velocity/velocity.jar -d proxy/build/classes \
            proxy/src/main/java/com/aizensmp/proxy/AizenProxy.java
          jar --create --file network/velocity/plugins/AizenProxy.jar \
            -C proxy/build/classes . \
            -C proxy/src/main/resources velocity-plugin.json
          test -s network/velocity/plugins/AizenProxy.jar
          echo "AizenProxy built successfully."

      - name: Install backend plugins
        shell: bash
        run: |
          set -euo pipefail

          # Resolve plugin files from Modrinth's project-version API.
          # Do not pin a Minecraft version here: the newest Paper/Purpur build
          # is selected, which avoids 404s when a plugin has not yet published
          # a build tagged exactly 1.21.11.
          MODRINTH_API="https://api.modrinth.com/v2"
          MODRINTH_UA="AizenSMP/1.0 (GitHub Actions)"

          modrinth_file() {
            local project="$1"
            local loader="$2"
            local url

            url=$(curl -fsSL --retry 5 --retry-delay 2 \
              -H "User-Agent: $MODRINTH_UA" \
              --get "$MODRINTH_API/project/$project/version" \
              --data-urlencode "loaders=[\"$loader\"]" \
              | jq -r '[.[].files[] | select(.primary == true) | .url][0] // empty')

            test -n "$url"
            test "$url" != "null"
            printf '%s' "$url"
          }

          SVC_URL=$(modrinth_file "simple-voice-chat" "paper")
          WE_URL=$(modrinth_file "worldedit" "paper")

          VIAVERSION_URL=$(curl -fsSL --retry 5 --retry-delay 2 \
            -H "User-Agent: $MODRINTH_UA" \
            --get "$MODRINTH_API/project/viaversion/version" \
            --data-urlencode 'loaders=["paper"]' \
            | jq -r '[.[].files[] | select(.primary == true) | .url][0] // empty')

          VIABACKWARDS_URL=$(curl -fsSL --retry 5 --retry-delay 2 \
            -H "User-Agent: $MODRINTH_UA" \
            --get "$MODRINTH_API/project/viabackwards/version" \
            --data-urlencode 'loaders=["paper"]' \
            | jq -r '[.[].files[] | select(.primary == true) | .url][0] // empty')

          for var in SVC_URL WE_URL VIAVERSION_URL VIABACKWARDS_URL; do
            value="${!var}"
            test -n "$value" && test "$value" != "null"
          done

          echo "Simple Voice Chat: $SVC_URL"
          echo "WorldEdit: $WE_URL"
          echo "ViaVersion: $VIAVERSION_URL"
          echo "ViaBackwards: $VIABACKWARDS_URL"

          SKRIPT_URL=$(modrinth_file "skript" "paper")
          LUCKPERMS_URL=$(modrinth_file "luckperms" "paper")

          # AuthMeReloaded: cracked-mode authentication with /register and /login.
          AUTHME_URL=$(curl -fsSL --retry 5 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/AuthMe/AuthMeReloaded/releases/latest" \
            | jq -r '[.assets[]
              | select(.name | test("(?i)^AuthMe-[0-9].*\\.jar$"))
              | select((.name | test("(?i)(Bungee|Velocity|Folia)")) | not)
              | .browser_download_url][0] // empty')
          test -n "$AUTHME_URL" && test "$AUTHME_URL" != "null"

          echo "Skript: $SKRIPT_URL"
          echo "LuckPerms: $LUCKPERMS_URL"
          echo "AuthMe: $AUTHME_URL"

          # Download AuthMe before compiling AizenAuthGuard: the guard depends on AuthMe's API classes.
          # The previous workflow tried to compile against network/germany/plugins/AuthMe.jar
          # before that file existed, which caused every run to fail at javac.
          mkdir -p network/germany/plugins
          curl -L --fail --retry 5 --retry-delay 2 -o "network/germany/plugins/AuthMe.jar" "$AUTHME_URL"
          test -s network/germany/plugins/AuthMe.jar
          jar tf network/germany/plugins/AuthMe.jar >/dev/null

          # Build the Aizen authentication guard against the exact Purpur API and AuthMe jar.
          rm -rf backend/build
          mkdir -p backend/build
          cat > backend/build/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.aizensmp</groupId>
            <artifactId>aizen-auth-guard-build</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.11-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
              <dependency>
                <groupId>fr.xephi.authme</groupId>
                <artifactId>authme</artifactId>
                <version>1.0</version>
                <scope>system</scope>
                <systemPath>${project.basedir}/../../network/germany/plugins/AuthMe.jar</systemPath>
              </dependency>
              <dependency>
                <groupId>com.google.code.gson</groupId>
                <artifactId>gson</artifactId>
                <version>2.13.2</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <sourceDirectory>${project.basedir}/../src/main/java</sourceDirectory>
              <resources>
                <resource>
                  <directory>${project.basedir}/../src/main/resources</directory>
                </resource>
              </resources>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.0</version>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          mvn -q -f backend/build/pom.xml package -DskipTests
          test -s backend/build/target/aizen-auth-guard-build-1.0.0.jar
          cp backend/build/target/aizen-auth-guard-build-1.0.0.jar backend/build/AizenAuthGuard.jar
          test -s backend/build/AizenAuthGuard.jar
          echo "AizenAuthGuard built successfully with Paper API, AuthMe API, and Gson."

          # Build the AizenShop economy/shop plugin.
          rm -rf backend-shop/build
          mkdir -p backend-shop/build
          cat > backend-shop/build/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.aizensmp</groupId>
            <artifactId>aizen-shop-build</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.11-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <sourceDirectory>${project.basedir}/../src/main/java</sourceDirectory>
              <resources>
                <resource>
                  <directory>${project.basedir}/../src/main/resources</directory>
                </resource>
              </resources>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.0</version>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          mvn -q -f backend-shop/build/pom.xml package -DskipTests
          test -s backend-shop/build/target/aizen-shop-build-1.0.0.jar
          cp backend-shop/build/target/aizen-shop-build-1.0.0.jar backend-shop/build/AizenShop.jar
          echo "AizenShop built successfully."

          for name in germany turkey america; do
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/Skript.jar" "$SKRIPT_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/LuckPerms.jar" "$LUCKPERMS_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/AuthMe.jar" "$AUTHME_URL"
            cp -f backend/build/AizenAuthGuard.jar "network/$name/plugins/AizenAuthGuard.jar"
            cp -f backend-shop/build/AizenShop.jar "network/$name/plugins/AizenShop.jar"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/ViaVersion.jar" "$VIAVERSION_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/ViaBackwards.jar" "$VIABACKWARDS_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/WorldEdit.jar" "$WE_URL"
            curl -L --fail --retry 5 --retry-delay 2 -o "network/$name/plugins/voicechat.jar" "$SVC_URL"
            mkdir -p "network/$name/plugins/Skript/scripts"
            find plugins/Skript/scripts -maxdepth 1 -type f -name "*.sk" ! -name "aizen_auth.sk" -exec cp -f {} "network/$name/plugins/Skript/scripts/" \;
            test -s "network/$name/plugins/Skript/scripts/aizen_all.sk"
            test -s "network/$name/plugins/Skript/scripts/aizen_bots.sk"
            test -s "network/$name/plugins/Skript/scripts/aizen_duel_arena.sk"
            test -s "network/$name/plugins/Skript/scripts/aizen_legendary_spawn.sk"
            test -s "network/$name/plugins/Skript/scripts/aizen_scoreboard.sk"
            echo "All AizenSMP Skript systems installed on $name."

            # AuthMe configuration: cracked-mode authentication with /register and /login.
            mkdir -p "network/$name/plugins/AuthMe"
            cat > "network/$name/plugins/AuthMe/config.yml" <<'EOF'
          DataSource:
            backend: SQLITE
          settings:
            sessions:
              enabled: false
            restrictions:
              allowChat: false
              allowCommands: false
              allowedCommands:
                - /login
                - /l
                - /register
                - /reg
                - /captcha
              allowMovement: false
              teleportUnAuthedToSpawn: true
            security:
              passwordHash: SHA256
          registration:
            enabled: true
            force: true
            enablePasswordVerifier: true
          protection:
            enableProtection: true
          EOF
          done

      - name: Configure backend servers and voice chat
        shell: bash
        run: |
          set -e

          configure_server() {
            local name="$1"
            local port="$2"
            local max_players="250"
            local display_name="America"
            if [ "$name" = "germany" ]; then
              max_players="350"
              display_name="Germany"
            elif [ "$name" = "turkey" ]; then
              max_players="250"
              display_name="Turkey"
            fi

            mkdir -p "network/$name/plugins/Skript/scripts"
            cat > "network/$name/server.properties" <<EOF
          motd=AizenSMP - $name
          online-mode=false
          enforce-secure-profile=false
          server-port=$port
          server-ip=127.0.0.1
          query.port=$port
          enable-query=false
          max-players=$max_players
          EOF

            cp -f plugins/Skript/scripts/aizen_scoreboard.sk "network/$name/plugins/Skript/scripts/aizen_scoreboard.sk"
            sed -i "s/SERVER_NAME/$display_name/g; s/MAX_PLAYERS/$max_players/g" "network/$name/plugins/Skript/scripts/aizen_scoreboard.sk"
          }
          configure_server germany 25566
          configure_server turkey 25567
          configure_server america 25568

          # One shared AuthMe SQLite database for all three regional backends.
          # NEVER replace a non-empty database with an empty one.
          # On migration, prefer the first existing non-empty regional database.
          if [ -s network/authme.db ]; then
            echo "Using persistent shared AuthMe database: $(stat -c%s network/authme.db) bytes."
          elif [ -s network/germany/plugins/AuthMe/authme.db ]; then
            echo "Migrating existing Germany AuthMe database."
            cp -f network/germany/plugins/AuthMe/authme.db network/authme.db
          elif [ -s network/turkey/plugins/AuthMe/authme.db ]; then
            echo "Migrating existing Turkey AuthMe database."
            cp -f network/turkey/plugins/AuthMe/authme.db network/authme.db
          elif [ -s network/america/plugins/AuthMe/authme.db ]; then
            echo "Migrating existing America AuthMe database."
            cp -f network/america/plugins/AuthMe/authme.db network/authme.db
          else
            echo "No existing AuthMe database found; creating a new one."
            mkdir -p network
            touch network/authme.db
          fi

          # Verify SQLite is readable before sharing it with all three servers.
          if command -v sqlite3 >/dev/null 2>&1 && [ -s network/authme.db ]; then
            sqlite3 network/authme.db "PRAGMA quick_check;" | grep -qx "ok" || {
              echo "::warning::Shared AuthMe database failed SQLite quick_check; keeping the file for recovery and not replacing it."
            }
          fi
          for name in germany turkey america; do
            rm -f "network/$name/plugins/AuthMe/authme.db"
            # Relative symlink survives GitHub runner workspace/path changes.
            ln -sf "../../../authme.db" "network/$name/plugins/AuthMe/authme.db"
          done

          # Preserve every existing OP across restarts and always enforce Aizenx as OWNER/OP.
          # Never overwrite ops.json with a one-player file: doing that used to erase other admins on restart.
          ensure_owner_op() {
            local file="$1"
            if [ ! -s "$file" ]; then
              printf '[]\n' > "$file"
            fi
            local tmp
            tmp=$(mktemp)
            if jq -e . "$file" >/dev/null 2>&1; then
              jq --arg uuid "fb0d4a3b-54a0-360f-afc3-649c15b979ff" --arg name "Aizenx" '
                [ .[] | select((.uuid // "") != $uuid and ((.name // "") | ascii_downcase) != ($name | ascii_downcase)) ]
                + [{uuid:$uuid,name:$name,level:4,bypassesPlayerLimit:true}]
              ' "$file" > "$tmp"
            else
              printf '[{"uuid":"fb0d4a3b-54a0-360f-afc3-649c15b979ff","name":"Aizenx","level":4,"bypassesPlayerLimit":true}]\n' > "$tmp"
            fi
            mv "$tmp" "$file"
          }

          for name in germany turkey america; do
            ensure_owner_op "network/$name/ops.json"
          done

          mkdir -p network/germany/plugins/voicechat
          cat > network/germany/plugins/voicechat/voicechat-server.properties <<'EOF'
          port=25570
          bind_address=0.0.0.0
          voice_host=stamina-trailside.tun.ply.gg:12304
          enable_groups=true
          max_voice_distance=48
          crouch_distance=24
          whisper_distance=24
          spectator_interaction=true
          hide_icons=false
          enable_recording=false
          allow_pings=true
          EOF

          mkdir -p network/turkey/plugins/voicechat
          cat > network/turkey/plugins/voicechat/voicechat-server.properties <<'EOF'
          port=25571
          bind_address=0.0.0.0
          voice_host=stamina-tolerance.tun.ply.gg:12317
          enable_groups=true
          max_voice_distance=48
          crouch_distance=24
          whisper_distance=24
          spectator_interaction=true
          hide_icons=false
          enable_recording=false
          allow_pings=true
          EOF

          mkdir -p network/america/plugins/voicechat
          cat > network/america/plugins/voicechat/voicechat-server.properties <<'EOF'
          port=25572
          bind_address=0.0.0.0
          voice_host=stamina-lightning.tun.ply.gg:12323
          enable_groups=true
          max_voice_distance=48
          crouch_distance=24
          whisper_distance=24
          spectator_interaction=true
          hide_icons=false
          enable_recording=false
          allow_pings=true
          EOF

      - name: Configure Velocity
        shell: bash
        run: |
          set -e
          cd network/velocity
          cat > velocity.toml <<'EOF'
          config-version = "2.7"
          bind = "0.0.0.0:25565"
          motd = "<gold>AizenSMP</gold>"
          show-max-players = 350
          online-mode = false
          force-key-authentication = false
          player-info-forwarding-mode = "none"
          announce-forge = false
          kick-existing-players = false
          ping-passthrough = "mods"
          sample-players-in-ping = true
          enable-player-address-logging = true

          [servers]
          Germany = "127.0.0.1:25566"
          Turkey = "127.0.0.1:25567"
          America = "127.0.0.1:25568"
          try = ["Germany"]

          [forced-hosts]
          EOF

      - name: Start Playit agent
        env:
          PLAYIT_SETUP_CODE: ${{ secrets.PLAYIT_SETUP_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/playit_gg"
          PLAYIT_SOCKET="$HOME/.config/playit_gg/playit.sock"
          PLAYIT_SECRET="$HOME/.config/playit_gg/playit.toml"
          API="https://api.playit.gg"

          # A Playit claim code is exactly 10 hexadecimal characters.
          # Ignore an old/invalid secret value and create a fresh code automatically.
          if [ ! -s "$PLAYIT_SECRET" ]; then
            CLAIM_CODE="${PLAYIT_SETUP_CODE:-}"
            if ! printf '%s' "$CLAIM_CODE" | grep -Eq '^[0-9a-fA-F]{10}$'; then
              CLAIM_CODE=$(openssl rand -hex 5)
              echo "Generated a fresh Playit claim code."
            else
              echo "Using PLAYIT_SETUP_CODE as the Playit claim code."
            fi

            echo "::notice::Open https://playit.gg/claim/$CLAIM_CODE and approve the new AizenSMP agent."
            echo "PLAYIT CLAIM URL: https://playit.gg/claim/$CLAIM_CODE"

            for i in {1..300}; do
              SETUP_RAW=$(curl -sS --retry 3 --retry-delay 1                 -H "Content-Type: application/json"                 -d "$(jq -cn --arg code "$CLAIM_CODE" --arg version "AizenSMP-GitHubActions/1.0"                   '{code:$code,agent_type:"self-managed",version:$version}')"                 "$API/claim/setup" || true)

              if echo "$SETUP_RAW" | jq -e '.error' >/dev/null 2>&1; then
                echo "::error::Playit claim setup rejected: $(echo "$SETUP_RAW" | jq -c '.error')"
                exit 1
              fi

              # The API response contains an outer HTTP status (often "success")
              # and the actual claim state may be nested or represented as an enum.
              # Only exchange the code after the claim has actually been accepted.
              STATE=$(echo "$SETUP_RAW" | jq -r '
                .. | strings
                | select(test("^(WaitingForUserVisit|WaitingForUser|UserAccepted|UserRejected|NotAccepted|NotSetup|CodeExpired|CodeNotFound|waiting_for_user_visit|waiting_for_user|user_accepted|user_rejected|not_accepted|not_setup|code_expired|code_not_found)$"))
              ' | tail -n1)

              if [ -z "$STATE" ]; then
                STATE=$(echo "$SETUP_RAW" | jq -r '.data.state // .data.status // .state // empty')
              fi

              if [ "$STATE" = "UserRejected" ] || [ "$STATE" = "user_rejected" ]; then
                echo "::error::Playit agent claim was rejected."
                exit 1
              fi

              if [ "$STATE" = "CodeExpired" ] || [ "$STATE" = "code_expired" ] || [ "$STATE" = "CodeNotFound" ] || [ "$STATE" = "code_not_found" ]; then
                echo "::error::Playit claim code expired or was not found."
                exit 1
              fi

              # Do not spam the log with the outer API status on every poll.
              if [ $((i % 10)) -eq 0 ] || [ "$STATE" = "UserAccepted" ] || [ "$STATE" = "user_accepted" ]; then
                echo "Playit claim state: $STATE"
              fi

              if [ "$STATE" = "UserAccepted" ] || [ "$STATE" = "user_accepted" ]; then
                EXCHANGE=$(curl -sS --retry 3 --retry-delay 1 \
                  -H "Content-Type: application/json" \
                  -d "$(jq -cn --arg code "$CLAIM_CODE" '{code:$code}')" \
                  "$API/claim/exchange" || true)

                SECRET=$(echo "$EXCHANGE" | jq -r '.secret_key // .data.secret_key // empty')
                if [ -n "$SECRET" ]; then
                  printf '%s' "$SECRET" > "$PLAYIT_SECRET"
                  chmod 600 "$PLAYIT_SECRET"
                  echo "Playit agent secret provisioned successfully."
                  break
                fi

                echo "::warning::Claim was accepted, but Playit did not return an agent secret yet. Retrying exchange..."
              fi

              sleep 2
            done
          fi

          if [ ! -s "$PLAYIT_SECRET" ]; then
            echo "::error::Playit agent secret is missing after claim."
            exit 1
          fi

          curl -L --fail --retry 5 --retry-delay 2 -o playitd             "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64"
          chmod +x playitd
          rm -f "$PLAYIT_SOCKET"
          nohup ./playitd --socket-path "$PLAYIT_SOCKET" --secret-path "$PLAYIT_SECRET"             > playitd.log 2>&1 &
          echo $! > playitd.pid

          for i in {1..30}; do
            [ -S "$PLAYIT_SOCKET" ] && break
            sleep 1
          done

          [ -S "$PLAYIT_SOCKET" ] || { cat playitd.log; exit 1; }

      - name: Persist Playit config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aizensmp-playit-config
          path: /home/runner/.config/playit_gg/playit.toml
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Start AizenSMP network
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
        shell: bash
        run: |
          set -u
          cleanup() {
            for pid in ${GERMANY_PID:-} ${TURKEY_PID:-} ${AMERICA_PID:-} ${VELOCITY_PID:-}; do
              [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
            done
            rm -f network/persistent-data.tar.zst
            tar --zstd -cf network/persistent-data.tar.zst \
              network/germany/world network/germany/world_nether network/germany/world_the_end \
              network/turkey/world network/turkey/world_nether network/turkey/world_the_end \
              network/america/world network/america/world_nether network/america/world_the_end \
              network/germany/plugins/Skript network/turkey/plugins/Skript network/america/plugins/Skript \
              network/germany/plugins/LuckPerms network/turkey/plugins/LuckPerms network/america/plugins/LuckPerms \
              network/germany/ops.json network/turkey/ops.json network/america/ops.json \
              network/authme.db network/authme.db-wal network/authme.db-shm \
              network/germany/plugins/AuthMe network/turkey/plugins/AuthMe network/america/plugins/AuthMe \
              2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          test -x "$JAVA21_HOME/bin/java"
          test -x "$JAVA25_HOME/bin/java"

          echo "Java 21: $("$JAVA21_HOME/bin/java" -version 2>&1 | head -n1)"
          echo "Java 25: $("$JAVA25_HOME/bin/java" -version 2>&1 | head -n1)"

          "$JAVA25_HOME/bin/java" -Xms256M -Xmx768M -jar network/velocity/velocity.jar > velocity.log 2>&1 &
          VELOCITY_PID=$!
          sleep 3
          if ! kill -0 "$VELOCITY_PID" 2>/dev/null; then
            echo "::error::Velocity exited during startup."
            cat velocity.log 2>/dev/null || true
            exit 1
          fi

          start_backend() {
            local name="$1"
            local jar="network/$name/server.jar"
            local log="$name.log"
            local pid
            for attempt in 1 2 3; do
              echo "eula=true" > "network/$name/eula.txt"
              (
                cd "network/$name"
                AIZEN_SERVER_NAME="$name" DASHBOARD_URL="$DASHBOARD_URL" DASHBOARD_API_TOKEN="$DASHBOARD_API_TOKEN" "$JAVA21_HOME/bin/java" -Xms512M -Xmx1024M -jar server.jar --nogui
              ) > "$log" 2>&1 &
              pid=$!
              sleep 8
              if kill -0 "$pid" 2>/dev/null; then
                echo "$name backend is running (attempt $attempt)." >&2
                printf '%s\n' "$pid"
                return 0
              fi
              echo "::warning::$name backend exited during startup; retrying ($attempt/3)."
              rm -rf "network/$name/libraries"
              sleep 2
            done
            return 1
          }

          GERMANY_PID=$(start_backend germany) || { echo "::error::Germany backend failed after 3 attempts."; exit 1; }
          TURKEY_PID=$(start_backend turkey) || { echo "::error::Turkey backend failed after 3 attempts."; exit 1; }
          AMERICA_PID=$(start_backend america) || { echo "::error::America backend failed after 3 attempts."; exit 1; }

          sleep 12

          echo "===== PROCESS STATUS ====="
          ps -o pid,stat,etime,cmd -p "$VELOCITY_PID,$GERMANY_PID,$TURKEY_PID,$AMERICA_PID" || true
          echo "===== VELOCITY LOG ====="
          cat velocity.log 2>/dev/null || true
          echo "===== GERMANY LOG ====="
          tail -80 germany.log 2>/dev/null || true
          echo "===== TURKEY LOG ====="
          tail -80 turkey.log 2>/dev/null || true
          echo "===== AMERICA LOG ====="
          tail -80 america.log 2>/dev/null || true

          for pid in "$VELOCITY_PID" "$GERMANY_PID" "$TURKEY_PID" "$AMERICA_PID"; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::AizenSMP server process $pid exited during startup."
              exit 1
            fi
          done

          echo "AizenSMP network is healthy and running."
          echo "Velocity: 25565"
          echo "Germany: 25566"
          echo "Turkey: 25567"
          echo "America: 25568"
          echo "Germany Voice: stamina-trailside.tun.ply.gg:12304 -> UDP 25570"
          echo "Turkey Voice: stamina-tolerance.tun.ply.gg:12317 -> UDP 25571"
          echo "America Voice: stamina-lightning.tun.ply.gg:12323 -> UDP 25572"
          echo "===== PLAYIT AGENT LOG ====="
          tail -80 playitd.log 2>/dev/null || true
          wait "$VELOCITY_PID"

      - name: Upload persistent server data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aizensmp-persistent-data
          path: network/persistent-data.tar.zst
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
