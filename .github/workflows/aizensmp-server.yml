name: AizenSMP Server

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: "Minecraft/Purpur version"
        required: true
        default: "1.21.11"

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout AizenSMP
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare server
        shell: bash
        run: |
          mkdir -p server
          cd server
          curl -fL "https://api.purpurmc.org/v2/purpur/${{ inputs.server_version }}/latest/download" -o purpur.jar
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enforce-secure-profile=false" >> server.properties
          mkdir -p plugins/Skript/scripts
          if [ -d "../plugins/Skript/scripts" ]; then
            cp -r ../plugins/Skript/scripts/* plugins/Skript/scripts/ || true
          fi

      - name: Install Skript
        shell: bash
        run: |
          cd server
          curl -fL "https://github.com/SkriptLang/Skript/releases/latest/download/Skript.jar" -o plugins/Skript.jar

      - name: Start AizenSMP
        shell: bash
        run: |
          cd server
          java -Xms512M -Xmx5G -jar purpur.jar --nogui